      <script>(function(){
var PROXY="https://lucky-cloud-0449stj-proxy.carlosalmeida-enc.workers.dev";
var params=new URLSearchParams(window.location.search);
var fonte=params.get("fonte")||"";
var id=params.get("id")||"";
if(id==="undefined")id="";
var title=params.get("t")||"";
var category=params.get("c")||"";
var monthKey=params.get("mk")||"";

var article=document.querySelector("[data-leitor]");
if(article){article.dataset.newsItem="";article.dataset.newsId=id;article.dataset.monthKey=monthKey;}
var readBtn=document.querySelector("[data-leitor-read]");
if(readBtn){readBtn.dataset.newsId=id;readBtn.dataset.monthKey=monthKey;}

var titleEl=document.querySelector("[data-leitor-title]");
var categoryEl=document.querySelector("[data-leitor-category]");
var dateEl=document.querySelector("[data-leitor-date]");
var bodyEl=document.querySelector("[data-leitor-body]");
var refsEl=document.querySelector("[data-leitor-refs]");
var sourceEl=document.querySelector("[data-leitor-source]");
var backEl=document.querySelector("[data-leitor-back]");

if(title&&titleEl)titleEl.textContent=title;
if(category&&categoryEl)categoryEl.textContent=category;
if(fonte&&sourceEl)sourceEl.href=fonte;
if(monthKey&&backEl)backEl.href=monthKey+".html";
document.title=(title||"Leitor")+" | Notícias jurídicas do STJ";

if(!fonte){bodyEl.innerHTML='<p class="empty">Nenhuma notícia selecionada.</p>';return;}
if(!PROXY){bodyEl.innerHTML='<p class="empty">Proxy não configurado.</p>';return;}

fetch(PROXY+"?url="+encodeURIComponent(fonte))
.then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.text();})
.then(function(html){
  var info=extractInfo(html);
  if(info.title&&titleEl){titleEl.textContent=info.title;document.title=info.title+" | Notícias jurídicas do STJ";}
  if(info.date&&dateEl)dateEl.textContent=info.date;
  if(info.category&&categoryEl)categoryEl.textContent=info.category;
  renderBlocks(bodyEl,info.blocks,id);
  if(info.processRefs){refsEl.innerHTML="<p>Esta notícia refere-se ao(s) processo(s):<\/p><strong>"+esc(info.processRefs)+"<\/strong>";refsEl.hidden=false;}
  if(typeof window.__njReinitHighlights==="function")window.__njReinitHighlights();
})
.catch(function(){
  bodyEl.innerHTML='<p class="empty">Não foi possível carregar. <a href="'+esc(fonte)+'" target="_blank">Abrir no STJ<\/a>.</p>';
});

function extractInfo(html){
  return {
    title:txt(elById(html,"pstj_elContTit"))||txt(elById(html,"pstj_elContTitNoticia")),
    date:(txt(elById(html,"pstj_elContCampoDataConteudo")).match(/\d{2}\/\d{2}\/\d{4}\s+\d{2}:\d{2}/)||[""])[0],
    category:txt(elById(html,"pstj_elContCategNoticia")).toUpperCase(),
    blocks:extractBlocks(extractBody(html)),
    processRefs:txt(elById(html,"pstj_elContTxtProcessosRelacionados"))
  };
}

function extractBody(html){
  var i=html.search(/<div[^>]*id=["']corpoDaNoticiaBox["'][^>]*>/i);
  if(i<0)return "";
  var mi=html.indexOf("<!--#END_CONT_COM_TIT#-->",i);
  var box=html.slice(i,mi>=0?mi:undefined);
  var wm=box.match(/<div[^>]*ControlWrapper_RichHtmlField[^>]*>/i);
  if(!wm||wm.index===undefined)return "";
  var content=box.slice(wm.index+wm[0].length);
  var lc=content.lastIndexOf("<\/div>");
  return lc>=0?content.slice(0,lc).trim():content.trim();
}

function extractBlocks(bodyHtml){
  var cleaned=(bodyHtml||"").replace(/<script[\s\S]*?<\/script>/gi,"").replace(/<style[\s\S]*?<\/style>/gi,"").replace(/<!--[\s\S]*?-->/g,"");
  var re=/<(p|h2|h3|li)\b[^>]*>([\s\S]*?)<\/\1>/gi;
  var blocks=[],m;
  while((m=re.exec(cleaned))){
    var tag=m[1].toLowerCase();
    var t=txt(m[2]);
    if(!t)continue;
    blocks.push({kind:tag==="h2"||tag==="h3"?"heading":"paragraph",text:tag==="li"?"\u2022 "+t:t});
  }
  if(blocks.length)return blocks;
  return txt(cleaned).split(/\n{2,}/).map(function(s){return s.replace(/\s+/g," ").trim();}).filter(Boolean).map(function(s){return{kind:"paragraph",text:s};});
}

function renderBlocks(container,blocks,articleId){
  if(!blocks||!blocks.length){container.innerHTML='<p class="empty">Texto não encontrado. <a href="'+esc(fonte)+'" target="_blank">Abrir no STJ<\/a>.</p>';return;}
  container.innerHTML="";
  blocks.forEach(function(block,i){
    var tag=block.kind==="heading"?"h2":"p";
    var cls=block.kind==="heading"?"article-subtitle":"article-paragraph";
    var el=document.createElement(tag);
    el.className=cls;
    el.dataset.highlightTarget="";
    el.dataset.highlightId=articleId+"-bloco-"+(i + 1);
    el.textContent=block.text;
    container.appendChild(el);
  });
}

function elById(html,id){
  var idx=html.indexOf('id="'+id+'"');
  if(idx<0)idx=html.indexOf("id='"+id+"'");
  if(idx<0)return "";
  var tagStart=html.lastIndexOf("<",idx);
  if(tagStart<0)return "";
  var tagEnd=html.indexOf(">",idx);
  if(tagEnd<0)return "";
  var tagMatch=html.slice(tagStart).match(/^<([a-z0-9]+)/i);
  if(!tagMatch)return "";
  var closeTag="<\/"+tagMatch[1]+">";
  var contentStart=tagEnd+1;
  var closeIdx=html.toLowerCase().indexOf(closeTag.toLowerCase(),contentStart);
  return closeIdx>=0?html.slice(contentStart,closeIdx):"";
}

function txt(html){
  return decode((html||"").replace(/<br\s*\/?\s*>/gi,"\n").replace(/<\/(p|div|h[1-6]|li)>/gi,"\n").replace(/<[^>]+>/g,"")).replace(/\u00a0/g," ").replace(/\s+/g," ").trim();
}

function decode(s){
  var named={amp:"&",apos:"'",gt:">",lt:"<",nbsp:" ",quot:'"',"#58":":"};
  return(s||"").replace(/&(#x?[0-9a-f]+|[a-z]+);/gi,function(w,e){
    var l=e.toLowerCase();
    if(named[l]!==undefined)return named[l];
    if(l[0]==="#"){var h=l[1]==="x";var c=parseInt(l.slice(h?2:1),h?16:10);return isFinite(c)?String.fromCodePoint(c):w;}
    return w;
  });
}

function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
})();</script>
